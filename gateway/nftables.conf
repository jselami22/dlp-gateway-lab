define CORP_NET = 10.10.0.0/24
define OUTSIDE_NET = 10.20.0.0/24

table inet lab
delete table inet lab

table inet lab {
    chain input{
        type filter hook input priority filter; policy drop;
        
        ct state established, related accept
        iif "lo" accept
        icmp type echo-request accept

        ip saddr $CORP_NET udp dport 53 accept
        ip saddr $CORP_NET tcp dport 53 accept
        ip saddr $CORP_NET tcp dport 8080 accept
    }
    chain forward{
        type filter hook forward priority filter; policy drop;
        
        ct state established,related accept

        ip saddr $CORP_NET ip daddr $OUTSIDE_NET counter comment "direct egress blocked"
    }
    chain output{
        type filter hook output priority filter; policy accept;
    }
}