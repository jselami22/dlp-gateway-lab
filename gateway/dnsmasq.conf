#Only answer from our own list
no-resolv
no-hosts

#Only listen on the gateways company side address 
bind-interfaces
listen-address=127.0.0.1
listen-address=10.10.0.2

#Our own domains
local=/corp/
local=/ext/

#Company names
host-record=gateway.corp,10.10.0.2
host-record=wiki.corp,10.10.0.20
host-record=mail.corp,10.10.0.25

#"Internet" names
host-record=cloud.ext,10.20.0.11
host-record=fileshare.ext,10.20.0.10
host-record=smtp.gmail.ext,10.20.0.12
host-record=webmail.ext,10.20.0.13

#Log every question
log-queries
log-facility=-
